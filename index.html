note": "", "url": "https://www.google.com/maps/place/APA+HOTEL+Kyoto+Eki+Horikawadori/data=!4m2!3m1!1s0x600108a875c3dc0b:0xdf5f2e330a7895b4", "city": "Kyoto", "category": "Hotel"}, {"title": "Nijō Castle", "note": "", "url": "https://www.google.com/maps/place/Nij%C5%8D+Castle/data=!4m2!3m1!1s0x600107d40a2b9b0b:0x106b8759906a2f2f", "city": "Kyoto", "category": "Sight / activity"}, {"title": "Kyoto Gyoen National Garden", "note": "", "url": "https://www.google.com/maps/place/Kyoto+Gyoen+National+Garden/data=!4m2!3m1!1s0x6001087b148e5f1d:0x1f8b7a1904610955", "city": "Kyoto", "category": "Sight / activity"}, {"title": "SAMURAI NINJA MUSEUM Kyoto", "note": "", "url": "https://www.google.com/maps/place/SAMURAI+NINJA+MUSEUM+Kyoto/data=!4m2!3m1!1s0x600109354e510f97:0xe3b7993ed91b2e77", "city": "Kyoto", "category": "Sight / activity"}, {"title": "Nishiki Market", "note": "", "url": "https://www.google.com/maps/place/Nishiki+Market/data=!4m2!3m1!1s0x6001089ccd8ccb4f:0xb69ea31001ec6c9c", "city": "Kyoto", "category": "Sight / activity"}, {"title": "Shirakawa Canal", "note": "", "url": "https://www.google.com/maps/place/Shirakawa+Canal/data=!4m2!3m1!1s0x600109dc68b3c787:0x973caa294d46a998", "city": "Kyoto", "category": "Sight / activity"}, {"title": "Maruyama Park", "note": "", "url": "https://www.google.com/maps/place/Maruyama+Park/data=!4m2!3m1!1s0x600108dcae68a29b:0xeb260d8a2775cd4b", "city": "Kyoto", "category": "Sight / activity"}, {"title": "Yasaka Shrine", "note": "", "url": "https://www.google.com/maps/place/Yasaka+Shrine/data=!4m2!3m1!1s0x60010879a010eca9:0xc77ac89d5a241ae9", "city": "Kyoto", "category": "Sight / activity"}, {"title": "Hōkan-ji Temple (Yasaka Pagoda)", "note": "", "url": "https://www.google.com/maps/place/H%C5%8Dkan-ji+Temple+(Yasaka+Pagoda)/data=!4m2!3m1!1s0x600108c560f8c421:0xb1cb2441e0223549", "city": "Kyoto", "category": "Sight / activity"}, {"title": "Ninenzaka", "note": "", "url": "https://www.google.com/maps/place/Ninenzaka/data=!4m2!3m1!1s0x600108d018ab0c97:0xe6ae59775061be35", "city": "Kyoto", "category": "Sight / activity"}, {"title": "Higashimuki Shopping Street", "note": "", "url": "https://www.google.com/maps/place/Higashimuki+Shopping+Street/data=!4m2!3m1!1s0x60013987e279cf53:0xc89284a82f97d5f2", "city": "Nara", "category": "Sight / activity"}, {"title": "Ukimido Pavilion", "note": "", "url": "https://www.google.com/maps/place/Ukimido+Pavilion/data=!4m2!3m1!1s0x60013992a4484099:0xe532d67cb8730666", "city": "Nara", "category": "Sight / activity"}, {"title": "To-ji Temple", "note": "", "url": "https://www.google.com/maps/place/To-ji+Temple/data=!4m2!3m1!1s0x6001060485fbaa4d:0xd3ee2dd9b0177910", "city": "Kyoto", "category": "Sight / activity"}, {"title": "Todai-ji Namdaimon (Grand South Gate)", "note": "", "url": "https://www.google.com/maps/place/Todai-ji+Namdaimon+(Grand+South+Gate)/data=!4m2!3m1!1s0x60013990f91570e9:0x802a25db25e31110", "city": "Nara", "category": "Sight / activity"}, {"title": "Nara National Museum", "note": "", "url": "https://www.google.com/maps/place/Nara+National+Museum/data=!4m2!3m1!1s0x60013991ec762bd1:0x86534c8f9901a7ed", "city": "Nara", "category": "Sight / activity"}, {"title": "Kōfuku-ji", "note": "", "url": "https://www.google.com/maps/place/K%C5%8Dfuku-ji/data=!4m2!3m1!1s0x60013988b23decb3:0x11830f4737834593", "city": "Nara", "category": "Sight / activity"}, {"title": "Kofukuji Temple National Treasure Museum", "note": "", "url": "https://www.google.com/maps/place/Kofukuji+Temple+National+Treasure+Museum/data=!4m2!3m1!1s0x60013988b25bb8cb:0x2023c0247bccc6c6", "city": "Nara", "category": "Sight / activity"}, {"title": "Manyo Club (Toyosu)", "note": "", "url": "https://www.google.com/maps/place/Manyo+Club+(Toyosu)/data=!4m2!3m1!1s0x601889a7257fa2b3:0x4f16b5579a219ae8", "city": "Tokyo", "category": "Saved place"}, {"title": "Richmond Hotel Narita", "note": "", "url": "https://www.google.com/maps/place/Richmond+Hotel+Narita/data=!4m2!3m1!1s0x60228b12a354ffdd:0x1c3f4457986e07c1", "city": "Narita", "category": "Hotel"}, {"title": "Osaka Castle", "note": "", "url": "https://www.google.com/maps/place/Osaka+Castle/data=!4m2!3m1!1s0x6000e0cd5c283afd:0xf01d07d5ca11e41", "city": "Osaka", "category": "Sight / activity"}], "sources": [{"label": "Trip bookings", "detail": "User-provided flight and hotel confirmations. Only operational details required for the booklet are reproduced; private booking identifiers are intentionally omitted."}, {"label": "Saved places", "detail": "110 nonblank records imported from Google Takeout → Saved → Japan Trip on 13 Aug 2026. Original Google Maps URLs and user notes are retained."}, {"label": "JR Central baggage rule", "detail": "Oversized baggage over 160 cm total dimensions on the Tokaido Shinkansen requires the appropriate reserved baggage seat/space.", "url": "https://global.jr-central.co.jp/en/info/oversized-baggage/"}, {"label": "JR East Narita Express", "detail": "Narita Express connects Narita Airport with Tokyo/Shinagawa and other major stations.", "url": "https://www.jreast.co.jp/en/multi/nex/"}, {"label": "Food evidence", "detail": "Food confidence notes use current official venue pages where available. “High” is not a medical guarantee; the traveller should still identify coeliac disease and reconfirm current procedures."}], "coeliac_jp": "私はセリアック病です。グルテンをほんの少量でも食べると具合が悪くなります。小麦、大麦、ライ麦と、それらを含む食品は食べられません。小麦を含む醤油も食べられません。\n\n同じ揚げ油、鉄板、グリル、トング、包丁、まな板、調理器具、調理台などをグルテンを含む食品と共有すると、微量の混入でも問題になります。\n\nこの料理はグルテンを含まない材料で、グルテンを含む食品から分けて調理できますか？難しい場合は、無理に対応せず教えてください。ありがとうございます。", "coeliac_en": "I have coeliac disease. Even a very small amount of gluten makes me ill. I cannot eat wheat, barley, rye, or foods containing them. I also cannot eat soy sauce that contains wheat.\n\nCross-contact matters. Shared frying oil, griddles, grills, tongs, knives, cutting boards, utensils or preparation surfaces used for gluten-containing foods can be unsafe for me.\n\nCan this dish be made with gluten-free ingredients and prepared separately from gluten-containing food? If that is difficult, please tell me rather than trying to adapt it. Thank you."}</script>
<script>
const D=JSON.parse(document.getElementById('data').textContent);
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
let state={view:'home',day:null,plan:{},chosen:{}};
try{state.chosen=JSON.parse(localStorage.getItem('japanPlanBChosen')||'{}')}catch(e){}
function saveChosen(){try{localStorage.setItem('japanPlanBChosen',JSON.stringify(state.chosen))}catch(e){}}
function todayISO(){const n=new Date();return n.getFullYear()+'-'+String(n.getMonth()+1).padStart(2,'0')+'-'+String(n.getDate()).padStart(2,'0')}
function currentTripDay(){return D.days.find(x=>x.date===todayISO())||null}
function showView(v){state.view=v;$$('.view').forEach(x=>x.classList.remove('active'));$('#'+v+'View').classList.add('active');$$('.navbtn').forEach(b=>b.classList.toggle('active',b.dataset.view===v));window.scrollTo({top:0,behavior:'auto'});if(v==='days')renderDays();}
function stopHTML(s,i){return `<div class="stop"><div class="stopname">${esc(i+1)}. ${esc(s.name)}</div><div class="tagrow"><span class="tag">${esc(s.kind)}</span>${s.saved?'<span class="tag saved">Our saved place</span>':''}${s.food?'<span class="tag food">Coeliac food</span>':''}</div>${s.why?`<div class="stopline">${esc(s.why)}</div>`:''}${s.note?`<div class="stopline"><strong>Note:</strong> ${esc(s.note)}</div>`:''}${s.url?`<a href="${esc(s.url)}" target="_blank" rel="noopener">Open in Google Maps when online</a>`:''}</div>`}
function planHTML(day,p){const chosen=state.chosen[day.date]===p.id;return `<article class="plan ${state.plan[day.date]===p.id?'active':''}" data-plan="${p.id}"><div class="planbox"><div class="planintro"><div><div class="kicker">Plan ${p.id}</div><h2>${esc(p.name)}</h2><p class="sub">${esc(p.summary)}</p></div><div><button class="choose ${chosen?'chosen':''}" data-choose="${p.id}" data-date="${day.date}">${chosen?'Chosen plan':'Choose this plan'}</button></div></div><div class="stats"><span class="stat">Best for: ${esc(p.fit)}</span><span class="stat">${esc(p.duration)}</span><span class="stat">Walking: ${esc(p.walk)}</span><span class="stat">Burden: ${esc(p.burden)}</span></div><div class="route">${p.stops.map(stopHTML).join('')}</div></div></article>`}
function dayHTML(day,standalone=false){if(!state.plan[day.date]) state.plan[day.date]=(state.chosen[day.date]||day.plans[0].id);return `<div class="daypage">${standalone?'<button class="back" data-back>← All days</button>':''}<div class="dayhero"><div class="kicker">${esc(day.label)} · ${esc(day.type)}</div><h1>${esc(day.headline)}</h1><div class="daymeta"><span class="chip strong">${esc(day.base)}</span><span class="chip">${day.plans.length} plan${day.plans.length>1?'s':''}</span></div><ul class="ops">${day.ops.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>${day.plans.length>1?`<div class="plantabs">${day.plans.map(p=>`<button class="plantab ${state.plan[day.date]===p.id?'active':''}" data-pick="${p.id}" data-date="${day.date}">Plan ${p.id}: ${esc(p.name)}</button>`).join('')}</div>`:''}${day.plans.map(p=>planHTML(day,p)).join('')}</div>`}
function renderHome(){const d=currentTripDay();const home=$('#homeView');let intro=`<div class="hero"><div class="kicker">${esc(D.trip.version)}</div><h1>${esc(D.trip.title)}</h1><p class="sub">${esc(D.trip.subtitle)}</p><div class="notice"><strong>Plan B principle:</strong> one self-contained HTML booklet, no runtime dependencies. Pick a coherent day rather than trying to collect every saved pin.</div></div>`;if(d) intro+=`<div class="section"><div class="sectionhead"><h2>Today</h2></div>${dayHTML(d,false)}</div>`;else intro+=`<div class="section"><div class="sectionhead"><h2>Trip menu</h2><span class="count">${D.days.length} days</span></div><div class="timeline">${D.days.map(x=>`<div class="dayrow" data-open-day="${x.date}"><div class="daydate">${esc(x.label.replace(' Sep',''))}</div><div><strong>${esc(x.headline)}</strong><div class="daybase">${esc(x.base)} · ${esc(x.type)}</div></div><div class="arrow">›</div></div>`).join('')}</div></div>`;home.innerHTML=intro;bind();}
function renderDays(){const box=$('#daysView');if(state.day){const d=D.days.find(x=>x.date===state.day);box.innerHTML=dayHTML(d,true)}else{box.innerHTML=`<div class="sectionhead"><h2>All days</h2><span class="count">Choose a day</span></div><div class="timeline">${D.days.map(x=>`<div class="dayrow" data-open-day="${x.date}"><div class="daydate">${esc(x.label)}</div><div><strong>${esc(x.headline)}</strong><div class="daybase">${esc(x.base)} · ${x.plans.length} plan${x.plans.length>1?'s':''}</div></div><div class="arrow">›</div></div>`).join('')}</div>`}bind();}
function renderFood(){const cities=['All',...new Set(D.food.map(x=>x.city))];$('#foodView').innerHTML=`<div class="sectionhead"><h2>Coeliac food</h2><span class="count">Research layer, not a guarantee</span></div><div class="notice">High confidence means current source material strongly supports a gluten-free environment/menu. It does not replace speaking with staff about coeliac disease and cross-contact. Medium means extra confirmation is important.</div><div class="foodfilters"><input id="foodQ" placeholder="Search food"><select id="foodCity">${cities.map(x=>`<option>${esc(x)}</option>`).join('')}</select><select id="foodConf"><option>All confidence</option><option>High</option><option>Medium-high</option><option>Medium</option></select></div><div id="foodCards" class="cards"></div>`;function paint(){let q=$('#foodQ').value.toLowerCase(), c=$('#foodCity').value, cf=$('#foodConf').value;let a=D.food.filter(x=>(c==='All'||x.city===c)&&(cf==='All confidence'||x.confidence===cf)&&(!q||(x.name+' '+x.note+' '+x.city).toLowerCase().includes(q)));$('#foodCards').innerHTML=a.map(x=>`<div class="card"><div class="cardtop"><h3>${esc(x.name)}</h3><span class="confidence ${esc(x.confidence)}">${esc(x.confidence)}</span></div><div class="mini">${esc(x.city)} · ${esc(x.kind)} ${x.saved?'· Our saved place':''}</div><p>${esc(x.note)}</p><div class="actions">${x.maps?`<a target="_blank" rel="noopener" href="${esc(x.maps)}">Google Maps</a>`:''}${x.source?`<a target="_blank" rel="noopener" href="${esc(x.source)}">Evidence source</a>`:''}</div></div>`).join('')||'<div class="empty">No matches.</div>'};['#foodQ','#foodCity','#foodConf'].forEach(s=>$(s).addEventListener('input',paint));paint();}
function renderSaved(){const cities=['All',...new Set(D.saved.map(x=>x.city).sort())],cats=['All',...new Set(D.saved.map(x=>x.category).sort())];$('#savedView').innerHTML=`<div class="sectionhead"><h2>Our saved places</h2><span class="count">${D.saved.length} imported</span></div><div class="notice">Imported from your Google Maps Takeout list. Food saved here is not automatically coeliac-safe; use the Food tab for assessed venues.</div><div class="savedfilters"><input id="savedQ" placeholder="Search 110 saved places"><select id="savedCity">${cities.map(x=>`<option>${esc(x)}</option>`).join('')}</select><select id="savedCat">${cats.map(x=>`<option>${esc(x)}</option>`).join('')}</select></div><div id="savedCards" class="cards"></div>`;function paint(){let q=$('#savedQ').value.toLowerCase(),c=$('#savedCity').value,k=$('#savedCat').value;let a=D.saved.filter(x=>(c==='All'||x.city===c)&&(k==='All'||x.category===k)&&(!q||(x.title+' '+x.note+' '+x.city+' '+x.category).toLowerCase().includes(q)));$('#savedCards').innerHTML=a.map(x=>`<div class="card"><div class="cardtop"><h3>${esc(x.title)}</h3></div><div class="mini">${esc(x.city)} · ${esc(x.category)}</div>${x.note?`<div class="savednote">${esc(x.note)}</div>`:''}<div class="actions">${x.url?`<a target="_blank" rel="noopener" href="${esc(x.url)}">Google Maps</a>`:''}</div></div>`).join('')||'<div class="empty">No matches.</div>'};['#savedQ','#savedCity','#savedCat'].forEach(s=>$(s).addEventListener('input',paint));paint();}
function renderPractical(){$('#practicalView').innerHTML=`<div class="sectionhead"><h2>Practical</h2><span class="count">Offline reference</span></div><div class="practicalgrid"><div class="practical"><h3>Hotels</h3>${D.trip.hotels.map(h=>`<div class="hotel"><strong>${esc(h.city)} · ${esc(h.name)}</strong><div class="mini">${esc(h.dates)}</div><div>${esc(h.address)}</div><div class="mini">${esc(h.note)}</div></div>`).join('')}</div><div class="practical"><h3>Flights</h3>${D.trip.flights.map(f=>`<div class="hotel"><strong>${esc(f.leg)}</strong><div>${esc(f.when)}</div><div class="mini">${esc(f.flight)}</div></div>`).join('')}<p class="mini">Private booking references and passenger details are intentionally not embedded.</p></div><div class="practical"><h3>Coeliac card · Japanese</h3><div class="bigcard">${esc(D.coeliac_jp)}</div><details><summary>English meaning</summary><div class="translation">${esc(D.coeliac_en)}</div></details></div><div class="practical"><h3>Transfer rules</h3><p><strong>Tokyo → Kyoto:</strong> Tokaido Shinkansen. Bags over 160 cm total dimensions require the appropriate oversized-baggage reservation.</p><p><strong>Kyoto → Narita:</strong> treat as a long transfer day. Shinkansen east, then connect toward Narita.</p><p><strong>Narita hotel:</strong> reserve the airport shuttle at check-in. The booking says it cannot be reserved earlier.</p><p><strong>Departure:</strong> booklet default is the 07:10 hotel shuttle for the 10:55 international flight, subject to reconfirmation at check-in.</p></div><div class="practical"><h3>Sources & confidence</h3>${D.sources.map(s=>`<div class="source"><strong>${esc(s.label)}</strong><div>${esc(s.detail)}</div>${s.url?`<a target="_blank" rel="noopener" href="${esc(s.url)}">Source</a>`:''}</div>`).join('')}</div><div class="practical"><h3>Privacy</h3><p>${esc(D.trip.privacy)}</p></div></div>`;}
function bind(){$$('[data-open-day]').forEach(x=>x.onclick=()=>{state.day=x.dataset.openDay;showView('days')});$$('[data-back]').forEach(x=>x.onclick=()=>{state.day=null;renderDays()});$$('[data-pick]').forEach(x=>x.onclick=()=>{state.plan[x.dataset.date]=x.dataset.pick;if(state.view==='home')renderHome();else renderDays()});$$('[data-choose]').forEach(x=>x.onclick=()=>{state.chosen[x.dataset.date]=x.dataset.choose;state.plan[x.dataset.date]=x.dataset.choose;saveChosen(); if(state.view==='home')renderHome(); else renderDays()});}
$$('.navbtn').forEach(b=>b.onclick=()=>{state.day=null;showView(b.dataset.view)});
renderHome();renderFood();renderSaved();renderPractical();
</script>
</body></html>
