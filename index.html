ka Castle","note":"","url":"https://www.google.com/maps/place/Osaka+Castle/data=!4m2!3m1!1s0x6000e0cd5c283afd:0xf01d07d5ca11e41","city":"Osaka","category":"Sight / activity","scope":"Core trip"}],"sources":[{"label":"Trip bookings","detail":"User-provided flight and hotel confirmations. Only operational details required for the booklet are reproduced; private booking identifiers are intentionally omitted."},{"label":"Saved places","detail":"110 nonblank records imported from Google Takeout → Saved → Japan Trip on 13 Aug 2026. Google Maps URLs are retained. Booking/PIN-style notes were scrubbed before embedding."},{"label":"JR Central — Tokyo to Kyoto","detail":"JR Central states Tokyo to Kyoto is about 130 minutes by Tokaido Shinkansen on the fastest services; use this only as a planning envelope, not a fixed timetable.","url":"https://global.jr-central.co.jp/en/onlinebooking/contents/kyoto/"},{"label":"JR Central — oversized baggage","detail":"Bags over 160 cm total external dimensions require the appropriate oversized-baggage reservation/space on the Tokaido Shinkansen.","url":"https://global.jr-central.co.jp/en/info/oversized-baggage/"},{"label":"JR East — Narita Express","detail":"Narita Express directly connects Narita Airport and Tokyo; JR East quotes 53 minutes for the fastest Narita Airport → Tokyo Station service.","url":"https://www.jreast.co.jp/en/multi/nex/"},{"label":"Kiyomizu-dera 2026 hours","detail":"Official 2026 schedule lists 06:00–18:00 for 1 Sep–20 Nov, supporting an early Higashiyama start.","url":"https://www.kiyomizudera.or.jp/en/location/"},{"label":"Kyoto Imperial Palace","detail":"Imperial Household Agency visitor guidance lists Monday as a regular closure day, supporting the Tuesday placement.","url":"https://sankan.kunaicho.go.jp/english/index.html"},{"label":"Nara National Museum","detail":"Current official guidance lists 09:30–17:00 and Monday closure; Wednesday 9 Sep is therefore a valid museum day, subject to temporary changes.","url":"https://www.narahaku.go.jp/english/info/fee-2/"},{"label":"Nara food operating pattern","detail":"Big Mountain is closed Tuesday and the third Wednesday; Naramachi Vegan Nabi is open Friday–Monday and closed Tuesday–Thursday. This is why Wednesday uses Big Mountain plus a carried backup.","url":"https://www.bmcaf.co/openinghour"},{"label":"Osaka food operating pattern","detail":"Comeconoco is currently open Wednesday–Saturday; SECONDROOM is closed Wednesday; Shinsekai Paprika also lists Wednesday as its regular closure. Thursday is therefore the strongest alignment.","url":"https://comeconoco.com/en/cafe/"},{"label":"Gluten Free T’s Kitchen","detail":"Official 2026 site lists a Harajuku branch opened 3 Apr 2026, Saturday/Sunday 12:00–22:00, and states wheat, barley and rye are not used; upstream ingredient cross-contact remains possible.","url":"https://glutenfree.co.jp/"},{"label":"UNO RAMEN","detail":"Official site states all menu items are gluten-free and vegan and gluten is not allowed into the kitchen; it also confirms the Kyoto Station branch opened 21 Dec 2025.","url":"https://soymilkramen.com/en/"},{"label":"Food confidence","detail":"High confidence is a strong evidence tier, not a medical guarantee. The traveller should identify coeliac disease and reconfirm current procedures, ingredients and closures at the venue."},{"label":"Seven Bank — overseas cards","detail":"Seven Bank provides an official international-card ATM service for cash cards and credit cards issued overseas. Card/network acceptance and fees remain issuer-specific.","url":"https://www.sevenbank.co.jp/oos/adv/intlcard02/en/"},{"label":"Japan Post Bank — international ATM service","detail":"Japan Post Bank states that cards issued by overseas institutions can be used to withdraw cash at eligible Japan Post Bank ATMs, subject to the supported card network and operating conditions.","url":"https://www.jp-bank.japanpost.jp/en/ias/en_ias_index.html"},{"label":"Kyoto Station Building — lockers and baggage","detail":"The official Kyoto Station Building guide identifies coin lockers and a baggage room, supporting Kyoto Station as the main luggage fallback in the booklet.","url":"https://www.kyoto-station-building.co.jp/lp/english/assets/img/english/guidemap.pdf"},{"label":"Narita Airport — cash services","detail":"Narita Airport lists ATMs and bank/currency-exchange facilities across its terminals. The booklet uses this as the final cash/currency fallback rather than assuming a specific counter will be open.","url":"https://www.narita-airport.jp/en/service/exchange/"},{"label":"ANA — Narita international check-in","detail":"ANA currently lists Narita international check-in at Terminal 1. The booklet still instructs travellers to confirm the terminal on the boarding pass/app before departure.","url":"https://www.ana.co.jp/en/jp/guide/boarding-procedures/checkin/international/counter_open/"}],"coeliac_jp":"私はセリアック病です。グルテンをほんの少量でも食べると具合が悪くなります。小麦、大麦、ライ麦と、それらを含む食品は食べられません。小麦を含む醤油も食べられません。\n\n同じ揚げ油、鉄板、グリル、トング、包丁、まな板、調理器具、調理台などをグルテンを含む食品と共有すると、微量の混入でも問題になります。\n\nこの料理はグルテンを含まない材料で、グルテンを含む食品から分けて調理できますか？難しい場合は、無理に対応せず教えてください。ありがとうございます。","coeliac_en":"I have coeliac disease. Even a very small amount of gluten makes me ill. I cannot eat wheat, barley, rye, or foods containing them. I also cannot eat soy sauce that contains wheat.\n\nCross-contact matters. Shared frying oil, griddles, grills, tongs, knives, cutting boards, utensils or preparation surfaces used for gluten-containing foods can be unsafe for me.\n\nCan this dish be made with gluten-free ingredients and prepared separately from gluten-containing food? If that is difficult, please tell me rather than trying to adapt it. Thank you.","readiness":[{"id":"tokyo-food","priority":"Before trip","title":"Reserve the Tokyo meal anchor for the plan you are most likely to use","detail":"Plan A: Tempura Asakusa SAKURA. Plan B/C: Gluten Free T’s Kitchen branch. Keep the other city options as fallbacks rather than trying to reserve everything."},{"id":"teamlab","priority":"Optional","title":"Decide whether teamLab Planets is worth a timed ticket","detail":"Only needed if the Toyosu arrival-day alternative remains genuinely attractive. Do not let a fixed arrival-day ticket create stress after the overnight flight."},{"id":"shinkansen-out","priority":"Before trip","title":"Set the Tokyo → Kyoto Shinkansen departure and reserve seats","detail":"If any bag exceeds 160 cm total external dimensions, use the appropriate oversized-baggage reservation/seat option."},{"id":"shinkansen-back","priority":"Before trip","title":"Set the Kyoto → Tokyo/Narita transfer rail plan for 11 September","detail":"Treat this as an airport-positioning day. Prefer a timetable with enough margin that a rail disruption does not threaten the Narita overnight objective."},{"id":"tokyo-breakfast","priority":"At check-in","title":"Reconfirm the coeliac breakfast request at Hotel Sunroute Ginza","detail":"The booking contains the request, but it remains a special request. Ask specifically about ingredients and cross-contact before relying on the breakfast."},{"id":"nara-food","priority":"1–2 days before","title":"Reconfirm Wednesday Nara food availability","detail":"Big Mountain is the working Wednesday anchor. Carry a known-safe snack/backup because several saved Nara gluten-free venues are normally closed mid-week."},{"id":"osaka-food","priority":"1–2 days before","title":"Reconfirm Thursday Osaka food availability","detail":"Thursday currently aligns better with Comeconoco, SECONDROOM and Paprika than Wednesday. Check for unscheduled closures."},{"id":"carry-backup","priority":"Packing","title":"Keep a coeliac emergency food kit for transfers and Nara","detail":"Use sealed products already known to be safe for the traveller. The booklet should not assume a convenience-store product is safe unless independently verified."},{"id":"narita-shuttle","priority":"11 Sep check-in","title":"Reserve the Richmond Hotel Narita airport shuttle","detail":"The hotel booking says the shuttle must be reserved at check-in and cannot be reserved beforehand."},{"id":"ana-terminal","priority":"11 Sep","title":"Confirm ANA departure terminal and check-in details","detail":"Current official information uses Narita Terminal 1 for ANA international check-in, but the boarding pass/app should be the final authority on the day."}],"practicalHubs":[{"id":"ginza","label":"Ginza / Yurakucho","use":"Tokyo hotel area and arrival-day fallback","query":"Ginza Yurakucho Tokyo Japan","note":"Use the hotel/Ginza/Yurakucho area as the low-stress regroup point on arrival day. Online shortcuts below can find the nearest service at the time.","services":["Public toilet","Convenience store","ATM","Pharmacy","Currency exchange"]},{"id":"tokyo-station","label":"Tokyo Station / Yaesu / Marunouchi","use":"Tokyo rail, lockers and intercity departure","query":"Tokyo Station Japan","note":"Primary rail fallback for the booklet. Useful for regrouping, intercity tickets, lockers and indoor shelter.","services":["Public toilet","Convenience store","ATM","Pharmacy","Coin locker","Currency exchange"]},{"id":"kyoto-station","label":"Kyoto Station","use":"Kyoto hotel/rail anchor and transfer-day fallback","query":"Kyoto Station Japan","note":"The Kyoto Station Building guide documents baggage storage and coin lockers. Treat the station as the operational fallback when a Kyoto day needs to be shortened.","services":["Public toilet","Convenience store","ATM","Pharmacy","Coin locker","Baggage storage","Currency exchange"]},{"id":"nara","label":"Kintetsu-Nara Station","use":"Nara sightseeing centre and regroup point","query":"Kintetsu Nara Station Japan","note":"The booklet treats Kintetsu-Nara as the practical centre for the Nara day. Return here if the route needs to be simplified or the food plan changes.","services":["Public toilet","Convenience store","ATM","Pharmacy","Coin locker"]},{"id":"umeda","label":"Osaka / Umeda","use":"Osaka rail hub and dinner/return anchor","query":"Osaka Station Umeda Japan","note":"Best large-hub fallback for returning to Kyoto, indoor shelter and practical services.","services":["Public toilet","Convenience store","ATM","Pharmacy","Coin locker","Currency exchange"]},{"id":"namba","label":"Namba / Dotonbori","use":"Osaka evening and street-level fallback","query":"Namba Station Osaka Japan","note":"Use Namba as the practical regroup point for the south/central Osaka plans.","services":["Public toilet","Convenience store","ATM","Pharmacy","Coin locker","Currency exchange"]},{"id":"narita-station","label":"JR / Keisei Narita Station","use":"Narita hotel area","query":"Narita Station Chiba Japan","note":"Primary town-centre fallback for the 11 September overnight. Keep the evening simple because the next morning is an international departure.","services":["Public toilet","Convenience store","ATM","Pharmacy","Coin locker","Currency exchange"]},{"id":"narita-airport","label":"Narita Airport Terminal 1","use":"ANA departure morning","query":"Narita Airport Terminal 1 Japan","note":"Narita Airport officially lists ATMs and bank/currency-exchange facilities. ANA currently lists Narita international check-in at Terminal 1; still confirm your terminal on the day.","services":["Public toilet","Convenience store","ATM","Pharmacy","Currency exchange","Baggage services"]}]}</script>
<script>

const ITINERARY_URLS=new Set(D.days.flatMap(d=>d.plans.flatMap(p=>p.stops.filter(s=>s.url).map(s=>s.url))));
const ITINERARY_FOOD=new Set(D.days.flatMap(d=>d.plans.flatMap(p=>p.stops.filter(s=>s.food).map(s=>s.food))));
let state={view:'home',day:null,plan:{},chosen:{},ready:{}};
try{state.chosen=JSON.parse(localStorage.getItem('japanPlanBChosen')||'{}')||{}}catch(e){}
try{state.ready=JSON.parse(localStorage.getItem('japanPlanBReady')||'{}')||{}}catch(e){}
function saveChosen(){try{localStorage.setItem('japanPlanBChosen',JSON.stringify(state.chosen))}catch(e){}}
function saveReady(){try{localStorage.setItem('japanPlanBReady',JSON.stringify(state.ready))}catch(e){}}
function todayISO(){const n=new Date();return n.getFullYear()+'-'+String(n.getMonth()+1).padStart(2,'0')+'-'+String(n.getDate()).padStart(2,'0')}
function currentTripDay(){return D.days.find(x=>x.date===todayISO())||null}
function readyStats(){const total=D.readiness?.length||0,done=D.readiness?.filter(x=>state.ready[x.id]).length||0;return{total,done}}
function updateReadyCounts(){const r=readyStats();$$('[data-ready-count]').forEach(x=>x.textContent=`${r.done}/${r.total} done`)}
function showView(v){state.view=v;$$('.view').forEach(x=>x.classList.remove('active'));$('#'+v+'View').classList.add('active');$$('.navbtn').forEach(b=>b.classList.toggle('active',b.dataset.view===v));window.scrollTo({top:0,behavior:'auto'});if(v==='days')renderDays();if(v==='practical')renderPractical();}
function stopHTML(s,i){return `<div class="stop"><div class="stopname">${esc(i+1)}. ${esc(s.name)}</div><div class="tagrow"><span class="tag">${esc(s.kind)}</span>${s.saved?'<span class="tag saved">Our saved place</span>':''}${s.food?'<span class="tag food">Coeliac food</span>':''}${s.timing?`<span class="tag timing">${esc(s.timing)}</span>`:''}${s.status?`<span class="tag status">${esc(s.status)}</span>`:''}</div>${s.why?`<div class="stopline">${esc(s.why)}</div>`:''}${s.note?`<div class="stopline"><strong>Note:</strong> ${esc(s.note)}</div>`:''}${s.url?`<a href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">Open in Google Maps when online</a>`:''}</div>`}
function planHTML(day,p){const chosen=state.chosen[day.date]===p.id,def=day.defaultPlan===p.id,savedCount=p.stops.filter(x=>x.saved).length,foodCount=p.stops.filter(x=>x.food).length;return `<article class="plan ${state.plan[day.date]===p.id?'active':''}" data-plan="${p.id}"><div class="planbox"><div class="planintro"><div><div class="kicker">Plan ${p.id}${def?'<span class="defaultbadge">baseline</span>':''}</div><h2>${esc(p.name)}</h2><p class="sub">${esc(p.summary)}</p></div><div><button class="choose ${chosen?'chosen':''}" data-choose="${p.id}" data-date="${day.date}">${chosen?'Chosen plan':'Choose this plan'}</button></div></div><div class="stats"><span class="stat">Best for: ${esc(p.fit)}</span><span class="stat">${esc(p.duration)}</span><span class="stat">Walking: ${esc(p.walk)}</span><span class="stat">Burden: ${esc(p.burden)}</span><span class="stat">${savedCount} saved stop${savedCount===1?'':'s'}</span><span class="stat">${foodCount} assessed food stop${foodCount===1?'':'s'}</span></div>${p.guardrail?`<div class="guardrail"><strong>Guardrail:</strong> ${esc(p.guardrail)}</div>`:''}${foodCount===0?'<div class="coveragewarn"><strong>Food gap:</strong> no assessed meal is built into this plan. Use the Food tab before committing and carry a known-safe backup.</div>':''}<div class="route">${p.stops.map(stopHTML).join('')}</div>${p.fallback?`<div class="fallback"><strong>Fallback hub:</strong> ${esc(p.fallback)}. If the day unravels, regroup here and simplify rather than crossing the city for a missed stop. <button class="inlinebtn" data-show-practical>Practical reference</button></div>`:''}</div></article>`}
function dayHTML(day,standalone=false){if(!state.plan[day.date]) state.plan[day.date]=(state.chosen[day.date]||day.defaultPlan||day.plans[0].id);return `<div class="daypage">${standalone?'<button class="back" data-back>← All days</button>':''}<div class="dayhero"><div class="kicker">${esc(day.label)} · ${esc(day.type)}</div><h1>${esc(day.headline)}</h1><div class="daymeta"><span class="chip strong">${esc(day.base)}</span><span class="chip">${day.plans.length} plan${day.plans.length>1?'s':''}</span></div>${day.decision?`<div class="decision"><strong>Why this day works:</strong> ${esc(day.decision)}</div>`:''}<ul class="ops">${day.ops.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>${day.plans.length>1?`<div class="plantabs">${day.plans.map(p=>`<button class="plantab ${state.plan[day.date]===p.id?'active':''}" data-pick="${p.id}" data-date="${day.date}">Plan ${p.id}: ${esc(p.name)}${day.defaultPlan===p.id?' · baseline':''}</button>`).join('')}</div>`:''}${day.plans.map(p=>planHTML(day,p)).join('')}</div>`}
function renderHome(){const d=currentTripDay(),home=$('#homeView'),r=readyStats();let intro=`<div class="hero"><div class="kicker">${esc(D.trip.version)}</div><h1>${esc(D.trip.title)}</h1><p class="sub">${esc(D.trip.subtitle)}</p><div class="notice"><strong>Plan B principle:</strong> pick a coherent day and a safe food strategy rather than trying to collect every saved pin.</div><div class="baseline"><strong>Suggested baseline</strong><br>${esc(D.trip.baseline)}<br><span class="mini">${esc(D.trip.research)}</span></div><div class="readystrip"><strong>Travel-readiness checklist</strong><span data-ready-count>${r.done}/${r.total} done</span><button class="inlinebtn" data-show-practical>Open</button></div></div>`;if(d) intro+=`<div class="section"><div class="sectionhead"><h2>Today</h2></div>${dayHTML(d,false)}</div>`;else intro+=`<div class="section"><div class="sectionhead"><h2>Trip menu</h2><span class="count">${D.days.length} days</span></div><div class="timeline">${D.days.map(x=>`<div class="dayrow" data-open-day="${x.date}"><div class="daydate">${esc(x.label.replace(' Sep',''))}</div><div><strong>${esc(x.headline)}</strong><div class="daybase">${esc(x.base)} · ${esc(x.type)} · baseline ${esc(x.defaultPlan||'A')}${state.chosen[x.date]?` · chosen ${esc(state.chosen[x.date])}`:''}</div></div><div class="arrow">›</div></div>`).join('')}</div></div>`;home.innerHTML=intro;bind();updateReadyCounts()}
function renderDays(){const box=$('#daysView');if(state.day){const d=D.days.find(x=>x.date===state.day);box.innerHTML=dayHTML(d,true)}else{box.innerHTML=`<div class="sectionhead"><h2>All days</h2><span class="count">Choose a day</span></div><div class="timeline">${D.days.map(x=>`<div class="dayrow" data-open-day="${x.date}"><div class="daydate">${esc(x.label)}</div><div><strong>${esc(x.headline)}</strong><div class="daybase">${esc(x.base)} · ${x.plans.length} plan${x.plans.length>1?'s':''} · baseline ${esc(x.defaultPlan||'A')}${state.chosen[x.date]?` · chosen ${esc(state.chosen[x.date])}`:''}</div></div><div class="arrow">›</div></div>`).join('')}</div>`}bind()}
function renderFood(){const cities=['All',...new Set(D.food.map(x=>x.city))],confs=['All confidence',...new Set(D.food.map(x=>x.confidence))],planStates=['All plan status','In itinerary','Spare'];$('#foodView').innerHTML=`<div class="sectionhead"><h2>Coeliac food</h2><span class="count">${D.food.length} assessed entries</span></div><div class="notice">Confidence describes the strength of current evidence, not a medical guarantee. High-risk uncertainty is stated explicitly. Reconfirm procedures and operating hours close to travel.</div><div class="foodfilters"><input id="foodQ" placeholder="Search food, route or note"><select id="foodCity">${cities.map(x=>`<option>${esc(x)}</option>`).join('')}</select><select id="foodConf">${confs.map(x=>`<option>${esc(x)}</option>`).join('')}</select><select id="foodPlan">${planStates.map(x=>`<option>${esc(x)}</option>`).join('')}</select></div><div id="foodCount" class="resultcount"></div><div id="foodCards" class="cards"></div>`;function paint(){let q=$('#foodQ').value.toLowerCase(),c=$('#foodCity').value,cf=$('#foodConf').value,ps=$('#foodPlan').value;let a=D.food.filter(x=>{const planned=ITINERARY_FOOD.has(x.name);return(c==='All'||x.city===c)&&(cf==='All confidence'||x.confidence===cf)&&(ps==='All plan status'||(ps==='In itinerary'&&planned)||(ps==='Spare'&&!planned))&&(!q||([x.name,x.note,x.city,x.kind,x.route,x.hours,x.cross].join(' ')).toLowerCase().includes(q))});$('#foodCount').textContent=`${a.length} shown`;$('#foodCards').innerHTML=a.map(x=>{const planned=ITINERARY_FOOD.has(x.name);return `<div class="card"><div class="cardtop"><h3>${esc(x.name)}</h3><span class="confidence ${esc(x.confidence)}">${esc(x.confidence)}</span></div><div class="mini">${esc(x.city)} · ${esc(x.kind)} ${x.saved?'· Our saved place':''}${planned?'<span class="foodplan">In itinerary</span>':''}</div><p>${esc(x.note)}</p><div class="foodmeta">${x.route?`<div><strong>Route fit:</strong> ${esc(x.route)}</div>`:''}${x.hours?`<div><strong>Current hours:</strong> ${esc(x.hours)}</div>`:''}${x.reservation?`<div><strong>Booking:</strong> ${esc(x.reservation)}</div>`:''}${x.cross?`<div><strong>Cross-contact:</strong> ${esc(x.cross)}</div>`:''}</div><div class="actions">${x.maps?`<a target="_blank" rel="noopener noreferrer" href="${esc(x.maps)}">Google Maps</a>`:''}${x.source?`<a target="_blank" rel="noopener noreferrer" href="${esc(x.source)}">Evidence source</a>`:''}</div></div>`}).join('')||'<div class="empty">No matches.</div>'}['#foodQ','#foodCity','#foodConf','#foodPlan'].forEach(s=>$(s).addEventListener('input',paint));paint()}
function renderSaved(){const cities=['All',...new Set(D.saved.map(x=>x.city).sort())],cats=['All',...new Set(D.saved.map(x=>x.category).sort())],scopes=['All scope',...new Set(D.saved.map(x=>x.scope).sort())],planStates=['All plan status','In itinerary','Spare'];$('#savedView').innerHTML=`<div class="sectionhead"><h2>Our saved places</h2><span class="count">${D.saved.length} imported</span></div><div class="notice">Imported from Google Takeout and reclassified. Food saved here is not automatically coeliac-safe; use the Food tab for assessed venues. Booking/PIN-style notes have been removed. “In itinerary” means the place appears in at least one A/B/C plan, not that you have committed to visit it.</div><div class="savedfilters"><input id="savedQ" placeholder="Search saved places"><select id="savedCity">${cities.map(x=>`<option>${esc(x)}</option>`).join('')}</select><select id="savedCat">${cats.map(x=>`<option>${esc(x)}</option>`).join('')}</select><select id="savedScope">${scopes.map(x=>`<option>${esc(x)}</option>`).join('')}</select><select id="savedPlan">${planStates.map(x=>`<option>${esc(x)}</option>`).join('')}</select></div><div id="savedCount" class="resultcount"></div><div id="savedCards" class="cards"></div>`;function paint(){let q=$('#savedQ').value.toLowerCase(),c=$('#savedCity').value,k=$('#savedCat').value,sc=$('#savedScope').value,ps=$('#savedPlan').value;let a=D.saved.filter(x=>{const planned=ITINERARY_URLS.has(x.url);return(c==='All'||x.city===c)&&(k==='All'||x.category===k)&&(sc==='All scope'||x.scope===sc)&&(ps==='All plan status'||(ps==='In itinerary'&&planned)||(ps==='Spare'&&!planned))&&(!q||([x.title,x.note,x.city,x.category,x.scope].join(' ')).toLowerCase().includes(q))});$('#savedCount').textContent=`${a.length} shown`;$('#savedCards').innerHTML=a.map(x=>{let cls=x.scope==='Core trip'?'core':x.scope==='Fringe / optional'?'fringe':'out',planned=ITINERARY_URLS.has(x.url);return `<div class="card"><div class="cardtop"><h3>${esc(x.title)}</h3></div><div class="mini">${esc(x.city)} · ${esc(x.category)}<span class="scope ${cls}">${esc(x.scope)}</span>${planned?'<span class="scope plannedtag">In itinerary</span>':''}</div>${x.note?`<div class="savednote">${esc(x.note)}</div>`:''}<div class="actions">${x.url?`<a target="_blank" rel="noopener noreferrer" href="${esc(x.url)}">Google Maps</a>`:''}</div></div>`}).join('')||'<div class="empty">No matches.</div>'}['#savedQ','#savedCity','#savedCat','#savedScope','#savedPlan'].forEach(s=>$(s).addEventListener('input',paint));paint()}
function searchLink(service,query){return 'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(service+' near '+query)}
function renderPractical(){const r=readyStats();$('#practicalView').innerHTML=`<div class="sectionhead"><h2>Practical</h2><span class="count">Offline reference</span></div><div class="practicalgrid"><div class="practical"><div class="readyhead"><h3>Travel-readiness checklist</h3><span class="readycount" data-ready-count>${r.done}/${r.total} done</span></div><div class="checklist">${D.readiness.map(x=>`<label class="checkrow ${state.ready[x.id]?'done':''}"><input type="checkbox" data-ready="${esc(x.id)}" ${state.ready[x.id]?'checked':''}><span><div class="checkpriority">${esc(x.priority)}</div><div class="checktitle">${esc(x.title)}</div><div class="mini">${esc(x.detail)}</div></span></label>`).join('')}</div><p class="mini">Checklist state is stored locally on this device only. There is no export/import workflow.</p></div><div class="practical"><h3>Hotels</h3>${D.trip.hotels.map(h=>`<div class="hotel"><strong>${esc(h.city)} · ${esc(h.name)}</strong><div class="mini">${esc(h.dates)}</div><div>${esc(h.address)}</div><div class="mini">${esc(h.note)}</div></div>`).join('')}</div><div class="practical"><h3>Flights</h3>${D.trip.flights.map(f=>`<div class="hotel"><strong>${esc(f.leg)}</strong><div>${esc(f.when)}</div><div class="mini">${esc(f.flight)}</div></div>`).join('')}<p class="mini">Private booking references and passenger details are intentionally not embedded.</p></div><div class="practical"><h3>Practical hubs</h3><p class="mini">The hub notes work offline. Search buttons require connectivity and simply hand off to Google Maps.</p>${D.practicalHubs.map(h=>`<div class="hub"><strong>${esc(h.label)}</strong><div class="mini">${esc(h.use)}</div><p>${esc(h.note)}</p><div class="hubtags">${h.services.map(x=>`<span class="hubtag">${esc(x)}</span>`).join('')}</div><div class="quicklinks">${h.services.map(x=>`<a target="_blank" rel="noopener noreferrer" href="${esc(searchLink(x,h.query))}">${esc(x)}</a>`).join('')}</div></div>`).join('')}</div><div class="practical"><h3>Cash & currency</h3><div class="cashnote"><p><strong>ATM fallback:</strong> Seven Bank and Japan Post Bank both provide official services for cards issued overseas, subject to supported card networks, issuer settings and fees.</p><p><strong>Airport fallback:</strong> Narita Airport lists ATMs and bank/currency-exchange services. Use the airport as the final fallback rather than depending on one specific city counter.</p><p><strong>Booklet rule:</strong> currency-exchange and ATM links are practical-service references only; the booklet does not assume a specific counter, exchange rate or fee will remain unchanged.</p></div></div><div class="practical"><h3>Coeliac card · Japanese</h3><div class="bigcard">${esc(D.coeliac_jp)}</div><details><summary>English meaning</summary><div class="translation">${esc(D.coeliac_en)}</div></details></div><div class="practical"><h3>Transfer rules</h3><p><strong>Narita → Tokyo:</strong> N’EX is a straightforward airport-to-Tokyo option; the fastest airport-to-Tokyo Station services are quoted at 53 minutes before onward travel to Ginza.</p><p><strong>Tokyo → Kyoto:</strong> Tokaido Shinkansen; fastest services are about 130 minutes. Bags over 160 cm total dimensions require the appropriate oversized-baggage reservation.</p><p><strong>Kyoto → Nara:</strong> treat Kintetsu-Nara as the practical sightseeing centre for the booklet. Check the exact departure on the day.</p><p><strong>Kyoto → Osaka:</strong> return via Osaka/Umeda where practical so dinner and the train home align.</p><p><strong>Kyoto → Narita:</strong> treat as a long transfer day; do not pre-commit the Narita afternoon.</p><p><strong>Narita hotel:</strong> reserve the airport shuttle at check-in. The booking says it cannot be reserved earlier.</p><p><strong>Departure:</strong> booklet default is the 07:10 hotel shuttle for the 10:55 flight, subject to reconfirmation at check-in. ANA currently lists international check-in at Terminal 1; confirm in the app/boarding pass.</p></div><div class="practical"><h3>Why Wed Nara / Thu Osaka?</h3><p><strong>Wednesday Nara:</strong> museum access is good, Big Mountain is normally open, but Nabi is closed. Carry a safe backup.</p><p><strong>Thursday Osaka:</strong> Comeconoco, SECONDROOM and Paprika line up materially better than on Wednesday.</p></div><div class="practical"><h3>Sources & confidence</h3>${D.sources.map(s=>`<div class="source"><strong>${esc(s.label)}</strong><div>${esc(s.detail)}</div>${s.url?`<a target="_blank" rel="noopener noreferrer" href="${esc(s.url)}">Source</a>`:''}</div>`).join('')}</div><div class="practical"><h3>Privacy</h3><p>${esc(D.trip.privacy)}</p></div></div>`;bind();updateReadyCounts()}
function bind(){$$('[data-open-day]').forEach(x=>x.onclick=()=>{state.day=x.dataset.openDay;showView('days')});$$('[data-back]').forEach(x=>x.onclick=()=>{state.day=null;renderDays()});$$('[data-pick]').forEach(x=>x.onclick=()=>{state.plan[x.dataset.date]=x.dataset.pick;if(state.view==='home')renderHome();else renderDays()});$$('[data-choose]').forEach(x=>x.onclick=()=>{state.chosen[x.dataset.date]=x.dataset.choose;state.plan[x.dataset.date]=x.dataset.choose;saveChosen();if(state.view==='home')renderHome();else renderDays()});$$('[data-show-practical]').forEach(x=>x.onclick=()=>{state.day=null;showView('practical')});$$('[data-ready]').forEach(x=>x.onchange=()=>{state.ready[x.dataset.ready]=x.checked;saveReady();const row=x.closest('.checkrow');if(row)row.classList.toggle('done',x.checked);updateReadyCounts()})}
$$('.navbtn').forEach(b=>b.onclick=()=>{state.day=null;showView(b.dataset.view)});
renderHome();renderFood();renderSaved();renderPractical();
</script>
</body></html>
